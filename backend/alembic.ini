[alembic]
script_location = alembic
prepend_sys_path = .
# Valor real vem de settings.database_url (alembic/env.py); este é só um marcador.
sqlalchemy.url = postgresql+psycopg://modelagem3d:CHANGE_ME@localhost:5433/modelagem3d_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

